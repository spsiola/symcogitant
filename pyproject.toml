[project]
name = "symcogitant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siarhei Psiola", email = "s.psiola@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
symcogitant = "symcogitant:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
