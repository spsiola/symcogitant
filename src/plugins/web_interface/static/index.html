<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symcogitant | Metabolism</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Symcogitant</h2>
            </div>
            
            <nav class="tabs-nav" id="tabs-nav">
                <!-- Tabs will be injected here -->
            </nav>
            
            <div class="sidebar-section-title" style="padding: 10px 20px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-secondary); border-top: 1px solid var(--border-color); margin-top: auto;">Разговоры</div>
            <nav class="tabs-nav talks-nav" id="talks-nav" style="flex-grow: 0; max-height: 40%; overflow-y: auto;">
                <!-- Talks will be injected here -->
            </nav>
            
            <div class="sidebar-footer">
                <button class="settings-btn" id="open-settings-btn">
                    ⚙️ Настройки
                </button>
                <button class="theme-toggle" id="theme-toggle-btn">
                    🌓 Сменить тему
                </button>
                <div class="system-info">
                    <div id="version-display">v0.2.0</div>
                    <div id="uptime-display">Uptime: 00:00:00</div>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <header class="content-header">
                <h1 id="page-title">Журнал</h1>
                <div class="status-indicator">
                    <span class="pulse"></span>
                    <span>System Online</span>
                </div>
            </header>
            
            <div id="tabs-content-container">
                <!-- Tab contents will be injected here -->
            </div>
        </main>
    </div>
    <!-- Settings Modal -->
    <div id="settings-modal" class="settings-modal-overlay" style="display: none;">
        <div class="settings-modal">
            <div class="settings-modal-sidebar">
                <h3>Настройки</h3>
                <div class="settings-nav" id="settings-nav">
                    <!-- Sections will be injected here -->
                </div>
            </div>
            <div class="settings-modal-content">
                <div class="settings-header">
                    <h2 id="settings-title">Общие настройки</h2>
                    <button class="close-btn" id="close-settings-btn" style="background: none; border: none; color: var(--text-primary); cursor: pointer; font-size: 1.2rem;">✕</button>
                </div>
                <div id="settings-form-container" style="flex-grow: 1; overflow-y: auto; padding: 15px 0;">
                    <textarea id="settings-yaml-editor" class="edit-modal-textarea" style="height: 100%; min-height: 400px; display: none;"></textarea>
                    <div id="settings-visual-editor"></div>
                </div>
                <div class="settings-footer" style="display: flex; justify-content: flex-end; padding-top: 15px; border-top: 1px solid var(--border-color);">
                    <button id="save-settings-btn" class="chat-send-btn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
