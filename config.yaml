core:
  watchdog_interval: 30

daemons:
  - module: "src.daemons.system_monitor.daemon"
    class: "SystemMonitorDaemon"
    enabled: true
    config:
      interval: 60
      llm_endpoints:
        ollama: "http://127.0.0.1:11434/v1/models"
        lm_studio: "http://localhost:1234/v1/models"
#        llama_cpp: "http://localhost:8080/v1/models"
#        vllm: "http://localhost:8000/v1/models"
#        jan: "http://localhost:1337/v1/models"
      openrouter_popular_models:
        - "openrouter/openai/gpt-5.6-luna"
        - "openrouter/anthropic/claude-opus-5"
        - "openrouter/google/gemini-3.8-flash"
        - "openrouter/z-ai/glm-5.3"
        - "openrouter/z-ai/glm-5.3-flash"
        - "openrouter/deepseek/deepseek-v4.1-flash"
        - "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"

  - module: "src.daemons.mcp_manager.daemon"
    class: "MCPManagerDaemon"
    enabled: true
    config: {}

workers:
  - module: "src.workers.tool_worker.worker"
    class: "ToolWorker"
    enabled: true
    config: {}

  - module: "src.workers.llm_worker.worker"
    class: "LLMWorker"
    enabled: true
    config:
      base_url: "http://127.0.0.1:11434/v1"
      api_key: "ollama"
      default_model: "qwen2.5-coder:7b"
      num_ctx: 8192

  - module: "src.workers.model_selector.worker"
    class: "ModelSelectorWorker"
    enabled: true
    config:
      routing:
        TelegramPrivateDispatcher:
          default_model: "qwen2.5-coder:7b"
          rules:
            - condition:
                chat_id: [428611700, 1380935931] # Доверенные контакты
              model: "openrouter/anthropic/claude-opus-5"
            
        TelegramGroupDispatcher:
          default_model: "qwen2.5-coder:7b"
          rules:
            - condition:
                chat_id: [-510553680] # Важная рабочая группа
              model: "atria/Atria-Dawn-Preview"
              api_key_name: "symcogitant"  # Здесь указываешь суффикс

interceptors:
  - module: "src.interceptors.security_interceptor.interceptor"
    class: "SecurityInterceptor"
    enabled: true
    config: {}

mcp_servers:
  weather:
    command: ".venv/bin/python"
    args: ["data/mcp_weather.py"]


plugins:
  - module: "src.plugins.web_interface.plugin"
    class: "WebInterfacePlugin"
    enabled: true
    config:
      host: "127.0.0.1"
      port: 4217

  - module: "src.plugins.media_telegram_user.plugin"
    class: "MediaTelegramUserPlugin"
    enabled: true
    config:
      session_path: "data/telegram_user"


  - module: "src.plugins.llm_chat.plugin"
    class: "LLMChatPlugin"
    enabled: true
    config:
      max_tool_iterations: 3

  - module: "src.plugins.telegram_private_dispatcher.plugin"
    class: "TelegramPrivateDispatcher"
    enabled: true
    config:
      timeout_sec: 1000
      default_model: "hf.co/unsloth/rnj-1-instruct-GGUF:Q4_K_M"
      window_size: 100

  - module: "src.plugins.telegram_group_dispatcher.plugin"
    class: "TelegramGroupDispatcher"
    enabled: true
    config:
      telegram_group_dispatcher:
        session_timeout_seconds: 1000
        max_context_messages: 100
        default_model: "hf.co/unsloth/rnj-1-instruct-GGUF:Q4_K_M"
